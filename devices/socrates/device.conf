# devices/socrates/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page is made from it, so that the status is said in one place.
#
# The port was made from the phone's own device tree (prebuilt/device-tree.dtb, pulled with
# `adb exec-out su -c "cat /sys/firmware/fdt"`); nothing of the phone's firmware is here.
#
# The whole chain was run on the phone: ABL -> HakiOS's U-Boot (fastboot boot, from RAM) -> the loader -> XNU 8796.121.2 ->
# Darwin 16.5's launchd -> backboardd -> SpringBoard, with the iOS 16.5 user space from an IPSW this port's owner fetched
# from Apple and unpacked (sysimage/unpack.sh). The home screen's widgets start and draw in software (no GPU driver yet:
# MiniIOMobileFramebuffer reports about 8 frames a second). Nothing is flashed and a reboot gives Android back.
#
# The kernel is the tree's prebuilt one, built for redwood's configuration and not yet rebuilt for sm8550 (that needs
# theos and an IPSW's SDK); the drivers below are what it does not have yet.
#
# Two things the port had to learn the hard way, both around the loader:
#   - the phone's log partition is named logfs, not logdump (xnuloader/loader.c, LOG_PARTITION_ALT);
#   - a root.apfs built on a 9p mount (WSL's /mnt/e) carries 0777 and uid 1000 inside it, and launchd then refuses every
#     job in it with "error = 122: Path had bad ownership/permissions"; it is built with userland/root.manifest (root:wheel).

device socrates
	title       Redmi K60 Pro
	vendor      Xiaomi
	soc         sm8550
	defconfig   socrates_defconfig
	maintainer  a HakiOS port
	status      display     works     U-Boot's simple-framebuffer on the phone's cont_splash_region: 1440 x 3200 at 0xb8000000, 5760 bytes a row; the loader's platform_socrates takes the phone by that address, XNU's MiniIOMobileFramebuffer finds the panel, and SpringBoard draws its home screen in software at about 8 frames a second
	status      usb         works     the loader's fastboot over USB (stage, oem run, get_staged) through U-Boot's EFI QCOM USB device protocol; getvar product answers xnuloader
	status      cpu         partial   one core (cpus=1); all eight, with the Cortex-X3 as bootcpu=7, not yet run
	status      storage     partial   the loader writes its log to the phone's logfs partition (8 MiB) and it was read back from Android after a run; UFS is otherwise untouched
	status      touch       missing   the panel's controller is Xiaomi's own (xiaomi-touch in the Android tree): not identified yet
	status      buttons     missing   the keys are in the U-Boot tree (PM8550 GPIO 6 as volume up, PON resin as volume down); the kernel's driver not ported
	status      gpu         missing   Adreno 740: hakios-metal has the tables of 0x06030500 only and refuses another
	status      audio       missing
	status      wifi        missing
	status      cellular    missing   soc.args still lacks soc_cmd_db, soc_mpss_mem, modem_ipa_fw_at and soc_pas_mpss
	status      haptic      missing
	status      camera      missing
	status      thermal     missing
